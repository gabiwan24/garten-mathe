<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Blumenweg – Erfolgs-Test</title>
<style>
  :root { --ink:#e8ecf4; --green:#2bb673; --card:rgba(24,26,32,.92); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#0d0e11; color:var(--ink); font:16px/1.4 system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .panel { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); width:min(calc(100% - 24px), 520px);
           background:var(--card); border-radius:14px; padding:12px 16px; display:grid; gap:10px;
           box-shadow:0 2px 14px rgba(31,42,68,.18); }
  label { display:grid; gap:2px; }
  .head { display:flex; justify-content:space-between; font-weight:600; }
  .head span { font-variant-numeric:tabular-nums; opacity:.6; font-weight:400; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:2px 16px; }
  .grid label { grid-template-columns:auto auto 1fr auto; align-items:center; gap:8px; font-size:13px; }
  .grid output { font-variant-numeric:tabular-nums; opacity:.6; min-width:2.2em; text-align:right; }
  .grid input { height:24px; }
  #tog { font:inherit; font-size:13px; padding:4px 8px; border:1px solid #555; background:#0d0e11; color:var(--ink); border-radius:8px; justify-self:start; }
  .panel.min > :not(.bar) { display:none; }
  .bar { display:flex; gap:8px; }
  .row { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; justify-content:space-between; }
  .chk { display:flex; align-items:center; gap:6px; font-size:13px; }
  #reset { font:inherit; font-size:13px; padding:4px 8px; border:1px solid #555; background:#0d0e11; color:var(--ink); border-radius:8px; }
  .panel { max-height:62vh; overflow:auto; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tabs button { font:inherit; font-size:13px; padding:4px 8px; border:1px solid #555; background:#0d0e11; color:var(--ink); border-radius:8px; }
  .tabs button.on { background:var(--green); color:#04140b; border-color:var(--green); }
  .small { font:inherit; font-size:13px; padding:4px 8px; border:1px solid #555; background:#0d0e11; color:var(--ink); border-radius:8px; justify-self:start; }
  .grid label.off { display:none; }
  [hidden] { display:none !important; }
  .ends { display:flex; justify-content:space-between; font-size:12px; opacity:.55; }
  input[type=range] { width:100%; height:30px; accent-color:var(--green); margin:0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip" class="zg-tip" hidden></div>
<div class="zg-fabs" id="fabs"></div>
<div class="panel" id="panel" hidden>
  <label>
    <div class="head">Alle erledigten Punkte <span id="cnt"></span></div>
    <input id="all" type="range" min="10" max="100" value="60">
    <div class="ends"><span>wenige Blumen</span><span>viele Blumen</span></div>
  </label>
  <div class="tabs" id="tabs"></div>
  <button id="finish" type="button" class="small">Garten abschließen / öffnen</button>
  <div class="grid" id="wps"></div>
  <div class="row"><label class="chk"><input id="keep" type="checkbox" checked>Wiese bleibt stehen (nie weniger)</label><button id="reset" type="button">Wiese zurücksetzen</button></div>
  <label>
    <div class="head">Ansicht (Mausrad / zwei Finger)</div>
    <input id="view" type="range" min="0" max="1000" value="0">
    <div class="ends"><span>Start</span><span>Ende</span></div>
  </label>
  <label>
    <div class="head">Wind <span id="windv"></span></div>
    <input id="wind" type="range" min="0" max="100" value="50">
    <div class="ends"><span>kein Wind</span><span>starke Böen</span></div>
  </label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="zg.css">
<script src="tasks.js"></script>
<script src="icons.js"></script>
<script src="ink.js"></script>
<script src="overlay.js"></script>
<script src="fireworks.js"></script>
<script>
const rnd = (a, b) => a + Math.random() * (b - a);
const SECTIONS = 4, SECTION = 8, WAYPOINTS = SECTIONS * SECTION, PER_WP = 200, N = WAYPOINTS * PER_WP; // 4 gardens of 8 waypoints, a fence between them
// one colour climate per waypoint (never green), neighbours well apart: blue, pink, orange, violet, red, azure, purple, amber
const CLIMATE_BASE = [0.60, 0.90, 0.07, 0.74, 0.99, 0.53, 0.82, 0.13];
const CLIMATE = Array.from({ length: WAYPOINTS }, (_, k) => CLIMATE_BASE[k % CLIMATE_BASE.length]);
const NODE_R = 0.7, CLEAR_R = 1.35; // nodes stay visible: no flowers inside CLEAR_R

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e11);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 150);

// Path like Duolingo: starts at the bottom (near), winds upwards (far). One node = one exercise.
const wpPos = [];
for (let k = 0; k < WAYPOINTS; k++) wpPos.push(new THREE.Vector3(Math.sin(k * 1.15) * 2.6, 0, 9 - k * 2.9 - Math.floor(k / SECTION) * 2.4)); // extra room for each fence
const HOUSE = new THREE.Vector3(wpPos[WAYPOINTS - 1].x, 0, wpPos[WAYPOINTS - 1].z - 8); // the witch cottage at the end of the path
const curve = new THREE.CatmullRomCurve3(wpPos);
const pathPts = curve.getSpacedPoints(600), PATH_CLEAR = 0.6; // flowers keep this distance from the stepping stones
const nearPath = (x, z) => pathPts.some(q => Math.hypot(q.x - x, q.z - z) < PATH_CLEAR);
// Every waypoint is a light source: scene materials are darkened by their distance to the nodes (edges almost black)
const lightU = {
  uNode: { value: wpPos.concat([HOUSE]) }, uInt: { value: Array(WAYPOINTS + 1).fill(0.08) },
  uLCol: { value: Array.from({ length: WAYPOINTS + 1 }, () => new THREE.Color(0.6, 0.6, 0.65)) }

function lit(mat) {

      vec4 wp_ = vec4(transformed, 1.0);

      vWP = (modelMatrix * wp_).xyz;`);
    sh.fragmentShader = `varying vec3 vWP; uniform vec3 uNode[${WAYPOINTS + 1}]; uniform vec3 uLCol[${WAYPOINTS + 1}]; uniform float uInt[${WAYPOINTS + 1}];\n` +
      sh.fragmentShader.replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );', `vec3 la_ = vec3(0.06);
      for (int i = 0; i < ${WAYPOINTS + 1}; i++) { vec2 d_ = vWP.xz - uNode[i].xz; float r2_ = dot(d_, d_) + vWP.y * vWP.y * 0.4; la_ += uLCol[i] * (uInt[i] * exp(-r2_ / 22.0)); }

  };

}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(70, 150).rotateX(-Math.PI / 2), lit(new THREE.MeshBasicMaterial({ color: 0x3c3e46 })));
ground.position.set(0, -0.01, -38); scene.add(ground);
// Path = light grey stepping stones following the curve; irregular rounded shapes (4 variants), random turn, size and jitter
{
  const stoneGeo = () => {
    const pts = [];
    for (let k = 0; k < 10; k++) { // squircle with a wobbly radius and a random aspect
      const a = k / 10 * Math.PI * 2, c = Math.cos(a), sn = Math.sin(a), r = 1 / Math.pow(Math.pow(Math.abs(c), 4) + Math.pow(Math.abs(sn), 4), 0.25) * rnd(0.88, 1.1);
      pts.push(new THREE.Vector3(c * r * 0.15 * rnd(0.92, 1.18), sn * r * 0.15, 0));
    }
    const outline = new THREE.CatmullRomCurve3(pts, true).getPoints(40).map(v => new THREE.Vector2(v.x, v.y));
    return new THREE.ExtrudeGeometry(new THREE.Shape(outline), { depth: 0.1, bevelEnabled: true, bevelThickness: 0.014, bevelSize: 0.014, bevelSegments: 3, curveSegments: 12 }).rotateX(-Math.PI / 2).translate(0, 0.014, 0);
  };
  const variants = Array.from({ length: 4 }, stoneGeo), stoneMat = lit(new THREE.MeshLambertMaterial({ color: 0xd2d2d2 }));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(-3, 5, 2.5); // only the stones use real lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.55), sun);
  const total = curve.getLength(), per = total / 2400, last = wpPos[WAYPOINTS - 1], doorZ = HOUSE.z + 1.7;
  const toDoor = []; for (let d = 0; d <= last.z - doorZ; d += per) toDoor.push(new THREE.Vector3(last.x, 0, last.z - d));
  const samples = curve.getSpacedPoints(2400).concat(toDoor);
  const placed = variants.map(() => []);
  let idx = 3, prevR = 0;
  for (let guard = 0; guard < 2000; guard++) {
    const sz = rnd(0.8, 1.15), R = 0.2 * sz; // R = generous radius of the stone incl. its corners
    if (prevR) idx += Math.max(1, Math.round((prevR + R + rnd(0.05, 0.11)) / per)); // step by both radii + a gap, so stones never touch
    prevR = R;
    if (idx >= samples.length - 3) break;
    const pt = samples[idx], nx = samples[idx + 2], pv = samples[idx - 2];
    if (wpPos.some(w => Math.hypot(w.x - pt.x, w.z - pt.z) < NODE_R + 0.22)) continue; // keep the waypoint discs free
    const tx = nx.x - pv.x, tz = nx.z - pv.z, tl = Math.hypot(tx, tz) || 1, off = rnd(-0.06, 0.06); // sideways jitter only: never closes the gap
    placed[Math.floor(Math.random() * 4)].push([pt.x + (-tz / tl) * off, pt.z + (tx / tl) * off, rnd(0, Math.PI * 2), sz]);
  }
  const mm = new THREE.Matrix4(), qq = new THREE.Quaternion(), yAxis = new THREE.Vector3(0, 1, 0);
  variants.forEach((g, v) => {
    const im2 = new THREE.InstancedMesh(g, stoneMat, Math.max(1, placed[v].length)); im2.frustumCulled = false;
    placed[v].forEach(([x, z, rot, sz], j) => { qq.setFromAxisAngle(yAxis, rot); mm.compose(new THREE.Vector3(x, 0, z), qq, new THREE.Vector3(sz, 1, sz)); im2.setMatrixAt(j, mm); im2.setColorAt(j, new THREE.Color().setScalar(rnd(0.8, 1))); });

// Garden fences between the sections, with a gate where the path passes
const fenceAt = Array.from({ length: SECTIONS }, (_, f) => f === SECTIONS - 1
  ? new THREE.Vector3(wpPos[WAYPOINTS - 1].x, 0, wpPos[WAYPOINTS - 1].z - 2.4)
  : curve.getPoint((SECTION * (f + 1) - 0.5) / (WAYPOINTS - 1)));
const gates = []; // one gate per garden: closed until every waypoint of the garden is done, then it dissolves into glitter
const GATE_PARTICLES = 160;
const FENCE_HALF = 9.5, GATE_HALF = 1.1;
{
  const shape = new THREE.Shape(); // picket with pointed top
  shape.moveTo(-0.07, 0); shape.lineTo(0.07, 0); shape.lineTo(0.07, 0.8); shape.lineTo(0, 0.95); shape.lineTo(-0.07, 0.8); shape.closePath();
  const pickGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.05, bevelEnabled: false }).translate(0, 0, -0.025);
  const wood = lit(new THREE.MeshBasicMaterial({ color: 0xc9bb99 })), post = lit(new THREE.MeshBasicMaterial({ color: 0x9c906f }));
  const pickets = [], mat = new THREE.Matrix4(), rail = new THREE.BoxGeometry(1, 0.07, 0.05), postGeo = new THREE.BoxGeometry(0.17, 1.15, 0.17).translate(0, 0.575, 0);
  const rails = new THREE.Group();
  for (const fp of fenceAt) {
    for (const [x0, x1] of [[-FENCE_HALF, fp.x - GATE_HALF], [fp.x + GATE_HALF, FENCE_HALF]]) {
      for (let x = x0 + 0.15; x < x1; x += 0.3) pickets.push([x, fp.z, rnd(-0.06, 0.06), rnd(0.92, 1.06)]);
      for (const y of [0.3, 0.62]) { const r = new THREE.Mesh(rail, wood); r.scale.x = x1 - x0; r.position.set((x0 + x1) / 2, y, fp.z - 0.05); rails.add(r); }
      for (const x of [x0, x1]) { const pst = new THREE.Mesh(postGeo, post); pst.position.set(x, 0, fp.z); rails.add(pst); }
    }
  }
  const im = new THREE.InstancedMesh(pickGeo, wood, pickets.length);
  pickets.forEach(([x, z, tilt, hs], i) => { mat.compose(new THREE.Vector3(x, 0, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, tilt)), new THREE.Vector3(1, hs, 1)); im.setMatrixAt(i, mat); });
  scene.add(im, rails);

  const sparkTex = (() => { // glitter: soft glow with a thin cross
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.25, 'rgba(255,255,255,.5)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 64, 64); g.fillStyle = '#fff'; g.fillRect(30, 4, 4, 56); g.fillRect(4, 30, 56, 4);
    return new THREE.CanvasTexture(c);
  })();
  fenceAt.forEach((fp, sIdx) => {
    const mat2 = lit(new THREE.MeshBasicMaterial({ color: 0xe6d6ac, transparent: true })), grp = new THREE.Group();
    grp.position.set(fp.x, 0, fp.z);
    for (let x = -GATE_HALF + 0.15; x < GATE_HALF; x += 0.3) { const pk = new THREE.Mesh(pickGeo, mat2); pk.position.x = x; grp.add(pk); }
    for (const y of [0.3, 0.62]) { const r = new THREE.Mesh(rail, mat2); r.scale.x = GATE_HALF * 2; r.position.set(0, y, -0.05); grp.add(r); }
    scene.add(grp);
    const pos = new Float32Array(GATE_PARTICLES * 3), colA = new Float32Array(GATE_PARTICLES * 3);
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.BufferAttribute(colA, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.34, map: sparkTex, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    pts.frustumCulled = false; pts.visible = false; scene.add(pts);
    gates.push({ s: sIdx, fp, grp, mat: mat2, pts, pos, colA, open: 0, prev: null, active: false,
      vel: new Float32Array(GATE_PARTICLES * 3), age: new Float32Array(GATE_PARTICLES), life: new Float32Array(GATE_PARTICLES), base: new Float32Array(GATE_PARTICLES * 3) });
  });
}

function burst(gt) { // glitter cloud over the gate
  const c = new THREE.Color();
  for (let i = 0; i < GATE_PARTICLES; i++) {
    gt.pos.set([gt.fp.x + rnd(-GATE_HALF, GATE_HALF), rnd(0.05, 1.1), gt.fp.z + rnd(-0.15, 0.15)], i * 3);
    gt.vel.set([rnd(-0.25, 0.25), rnd(0.25, 0.9), rnd(-0.2, 0.2)], i * 3);
    gt.age[i] = -rnd(0, 0.9); gt.life[i] = rnd(1.8, 3.2);
    c.setHSL(rnd(0.08, 0.16) + (Math.random() < 0.3 ? rnd(-0.5, 0.4) : 0), rnd(0.4, 0.9), rnd(0.7, 0.9)); gt.base.set([c.r, c.g, c.b], i * 3);
  }
  gt.active = true; gt.pts.visible = true;
  // ~10 butterflies pop out of the opening gate and flutter away quickly (created on first use)
  if (!gt.bf) gt.bf = Array.from({ length: 10 }, () => {
    const g = new THREE.Group(), wm = new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(noGreen(rnd(0, 1)), 0.85, 0.62), side: THREE.DoubleSide });
    const wings = [1, -1].map(d => { const w = new THREE.Mesh(wingGeo, wm); w.scale.set(d, 1, 1); g.add(w); return w; });
    const body = new THREE.Mesh(beeGeo, new THREE.MeshBasicMaterial({ color: 0x4a3b32 })); body.scale.set(0.45, 0.4, 1.8); g.add(body);
    g.visible = false; scene.add(g);
    return { g, wings, vel: new THREE.Vector3(), age: 0, life: 3.5, ph: rnd(0, 6.28) };
  });
  for (const b of gt.bf) {
    b.g.position.set(gt.fp.x + rnd(-0.9, 0.9), rnd(0.3, 1), gt.fp.z + rnd(-0.1, 0.1));
    b.vel.set(rnd(-2.2, 2.2), rnd(0.6, 1.5), -rnd(1.6, 3.6)); // mostly onwards, up the path
    b.age = -rnd(0, 0.7); b.life = rnd(3, 4.2); b.g.visible = true; b.g.scale.setScalar(0);
  }

}
const nodeFlash = Array(WAYPOINTS).fill(0), seqs = [];
const hueOf = g => CLIMATE[g * SECTION + SECTION - 1] * 360;
const GROW_WAIT = 2.6; // seconds the flowers get to grow before anything travels on
function startSeq(gt) { seqs.push({ gt, t: -GROW_WAIT, i: 0, released: false }); }
function updateSeqs(dt) {
  for (let q = seqs.length - 1; q >= 0; q--) {
    const sq = seqs[q]; sq.t += dt;
    while (sq.i < SECTION && sq.t >= sq.i * 0.42) { const k = sq.gt.s * SECTION + sq.i; nodeFlash[k] = 1; ZGUI.chime(sq.i); viewTarget = clampView(wpPos[k].z - 4); sq.i++; } // bottom to top
    if (!sq.released && sq.t >= SECTION * 0.42 + 0.7) {
      sq.released = true; sq.gt.release = true; burst(sq.gt); ZGUI.fanfare(); viewTarget = clampView(sq.gt.fp.z - 3);
      const g = sq.gt.s, all = [0, 1, 2, 3].every(x => ZGTasks.gardenComplete(prog, x) || done.slice(x * SECTION, (x + 1) * SECTION).every(Boolean));
      const showTbl = after => setTimeout(() => ZGUI.showTable(ZGTasks.gardenSummary(prog, g), hueOf(g), { okText: all && g === 3 ? 'Weiter' : 'Weiter geht\'s', onClose: after }), 2600);
      if (all && g === SECTIONS - 1) {
        ZGFireworks.start({ seconds: 14, hues: CLIMATE_BASE, onSound: big => { ZGUI.tone(95, 0, 0.3, 0.06, 'triangle'); ZGUI.tone(900 + Math.random() * 900, 0.04, 0.14, 0.015); if (big) ZGUI.tone(60, 0, 0.5, 0.07, 'triangle'); },
          onEnd: () => ZGUI.showTable(ZGTasks.gardenSummary(prog, g), hueOf(g), { okText: 'Weiter', onClose: () => ZGUI.showFinale([0, 1, 2, 3].map(x => ZGTasks.gardenSummary(prog, x)), hueOf(g)) }) });
      } else showTbl();
      seqs.splice(q, 1);

}
function updateGate(gt, dt, complete) {
  if (gt.prev === null) { gt.open = complete ? 1 : 0; gt.release = complete; } // already solved when the page loads: no show
  else if (complete && !gt.prev) startSeq(gt);
  else if (!complete) gt.release = false;
  gt.prev = complete;
  gt.open += (((complete && gt.release) ? 1 : 0) - gt.open) * Math.min(1, dt * 1.8);
  const dis = smooth(0.1, 0.95, gt.open);
  gt.grp.visible = dis < 0.99;
  gt.mat.opacity = 1 - dis; gt.grp.position.y = -0.5 * dis;
  if (gt.bfActive) {

      if (b.age > b.life) { b.g.visible = false; continue; }

      b.g.position.x += Math.sin(a * 5 + b.ph) * 0.02; b.g.position.y += Math.sin(a * 7 + b.ph) * 0.012;
      b.g.scale.setScalar(Math.min(1, a * 5) * Math.min(1, (b.life - a) / 0.8));

      const fl = Math.sin(a * 20 + b.ph) * 0.9; b.wings[0].rotation.z = fl; b.wings[1].rotation.z = -fl;
    }

  for (let i = 0; i < GATE_PARTICLES; i++) {
    const a = gt.age[i] += dt, j = i * 3;
    if (a < 0) { gt.colA[j] = gt.colA[j + 1] = gt.colA[j + 2] = 0; alive = true; continue; }
    if (a > gt.life[i]) { gt.colA[j] = gt.colA[j + 1] = gt.colA[j + 2] = 0; continue; }

    gt.pos[j] += gt.vel[j] * dt + Math.sin(a * 3 + i) * 0.004; gt.pos[j + 1] += gt.vel[j + 1] * dt; gt.pos[j + 2] += gt.vel[j + 2] * dt;

const NODE_H = 0.3;
const nodeGeo = new THREE.LatheGeometry([[0, 0], [NODE_R - 0.04, 0], [NODE_R, 0.05], [NODE_R, NODE_H - 0.1], [NODE_R - 0.05, NODE_H - 0.03], [NODE_R - 0.13, NODE_H], [0, NODE_H]].map(([r, y]) => new THREE.Vector2(r, y)), 56);
function discMaterial() {

    vertexShader: `varying vec3 vN; varying vec3 vP;

    fragmentShader: `uniform vec3 uColor; uniform float uGlow; varying vec3 vN; varying vec3 vP;
      void main() {

    c.g.rotation.y = Math.atan2(-(z - c.pz), x - c.px) * (c.px || c.pz ? 1 : 0); c.px = x; c.pz = z;
    c.g.position.set(x, y, z);
    const fl = Math.sin(t * (c.bee ? 55 : 16) + c.ph) * (c.bee ? 0.5 : 0.9);
    c.wings[0].rotation.z = fl; c.wings[1].rotation.z = -fl;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
